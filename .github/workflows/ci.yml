name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build
        env:
          # A build with no Supabase env vars still succeeds — the app falls
          # back to the mock data layer (see src/data/index.ts) — so CI never
          # needs real secrets just to prove the app compiles.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
